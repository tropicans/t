<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Taut Logo Interlocking Link Weave</title>
  <style>
    body {
      background: #faf9f5;
      color: #141413;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 800px;
      width: 100%;
    }
    .card {
      background: #efe9de;
      border: 1px solid #e6dfd8;
      border-radius: 20px;
      padding: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
    .dark-card {
      background: #181715;
      border: 1px solid #282724;
      color: #faf9f5;
    }
    .wordmark {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      color: #cc785c;
    }
    .tagline {
      font-size: 13px;
      color: #6c6a64;
      letter-spacing: 0.5px;
    }
    .dark-card .tagline {
      color: #a09d96;
    }
  </style>
</head>
<body>
  <h1>Taut Brand Identity: The Interlocking Weave</h1>
  
  <div class="grid">
    <!-- Light Card -->
    <div class="card">
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="taut-grad-light" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#E2896C"/>
              <stop offset="60%" stop-color="#CC785C"/>
              <stop offset="100%" stop-color="#A55238"/>
            </linearGradient>
            <filter id="shadow-light" x="-10%" y="-10%" width="125%" height="125%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#a55238" flood-opacity="0.25"/>
            </filter>
          </defs>
          <!-- Squircle badge -->
          <rect width="48" height="48" rx="14" fill="url(#taut-grad-light)" filter="url(#shadow-light)"/>
          
          <!-- Interlocking Weave Geometry -->
          <g transform="rotate(-45 24 24)">
            <!-- Link 2 (Base) -->
            <rect x="20" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.2" fill="none"/>
            <!-- Link 1 (Base) -->
            <rect x="8" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.2" fill="none"/>
            <!-- Overlap weave: top of Link 1 crosses over Link 2 -->
            <path d="M19 17.5H21.5C25.0899 17.5 28 20.4101 28 24C28 24.5 27.9 25 27.7 25.5" stroke="#FAF9F5" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
        
        <div class="wordmark">
          <span>Taut</span><span class="dot">.</span>
        </div>
      </div>
      <div class="tagline">Editorial Link-in-Bio & URL Shortener</div>
    </div>

    <!-- Dark Surface Card -->
    <div class="card dark-card">
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="taut-grad-dark" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#E2896C"/>
              <stop offset="60%" stop-color="#CC785C"/>
              <stop offset="100%" stop-color="#A55238"/>
            </linearGradient>
            <filter id="glow-dark" x="-10%" y="-10%" width="125%" height="125%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#cc785c" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect width="48" height="48" rx="14" fill="url(#taut-grad-dark)" filter="url(#glow-dark)"/>
          <g transform="rotate(-45 24 24)">
            <rect x="20" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.2" fill="none"/>
            <rect x="8" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.2" fill="none"/>
            <path d="M19 17.5H21.5C25.0899 17.5 28 20.4101 28 24C28 24.5 27.9 25 27.7 25.5" stroke="#FAF9F5" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
        
        <div class="wordmark">
          <span>Taut</span><span class="dot">.</span>
        </div>
      </div>
      <div class="tagline">Editorial Link-in-Bio & URL Shortener</div>
    </div>
  </div>

  <!-- Bare Mark (No Squircle Background) -->
  <div style="display: flex; gap: 40px; margin-top: 20px; align-items: center;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 14px; color: #6c6a64;">Bare Terracotta Mark:</span>
      <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-45 24 24)">
          <rect x="20" y="17.5" width="20" height="13" rx="6.5" stroke="#CC785C" stroke-width="3.8" fill="none"/>
          <rect x="8" y="17.5" width="20" height="13" rx="6.5" stroke="#CC785C" stroke-width="3.8" fill="none"/>
          <path d="M19 17.5H21.5C25.0899 17.5 28 20.4101 28 24C28 24.5 27.9 25 27.7 25.5" stroke="#CC785C" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>
    
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 14px; color: #6c6a64;">Icon Size (24px):</span>
      <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="14" fill="#CC785C"/>
        <g transform="rotate(-45 24 24)">
          <rect x="20" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.6" fill="none"/>
          <rect x="8" y="17.5" width="20" height="13" rx="6.5" stroke="#FAF9F5" stroke-width="3.6" fill="none"/>
          <path d="M19 17.5H21.5C25.0899 17.5 28 20.4101 28 24C28 24.5 27.9 25 27.7 25.5" stroke="#FAF9F5" stroke-width="3.6" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
